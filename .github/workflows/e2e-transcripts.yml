# Commento didattico: smoke test transcript limitato al branch e deployment DEV.
# Il workflow usa solo il cron secret dell'environment `dev` e l'ID fixture non segreto.
name: E2E Trascrizioni (DEV)

on:
  workflow_dispatch:

concurrency:
  group: e2e-transcripts-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  transcript-smoke:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    env:
      E2E_DEV_CRON_SECRET: ${{ secrets.E2E_DEV_CRON_SECRET }}
      E2E_DEV_TRANSCRIPT_VIDEO_ID: ${{ vars.E2E_DEV_TRANSCRIPT_VIDEO_ID }}
    steps:
      - name: Esegui smoke fixture DEV
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "Esito: rifiutato (ref non autorizzato)."
            exit 1
          fi
          if [[ -z "$E2E_DEV_CRON_SECRET" || -z "$E2E_DEV_TRANSCRIPT_VIDEO_ID" ]]; then
            echo "Esito: prerequisiti mancanti nell'environment GitHub dev."
            exit 1
          fi
          if [[ ! "$E2E_DEV_TRANSCRIPT_VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
            echo "Esito: fixture DEV non valida."
            exit 1
          fi

          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file"' EXIT
          set +e
          http_code="$(curl --silent --dump-header "$headers_file" --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${E2E_DEV_CRON_SECRET}" \
            "https://dev.utraya.com/api/cron/transcripts?fixture_video_id=${E2E_DEV_TRANSCRIPT_VIDEO_ID}&limit=1")"
          curl_status=$?
          set -e

          if [[ "$curl_status" -ne 0 ]]; then
            echo "Esito: fallito (richiesta DEV non riuscita)."
            exit 1
          fi
          if [[ "$http_code" != "200" ]]; then
            if grep -qi '^X-Transcript-Fixture-Cleanup:[[:space:]]*failed' "$headers_file"; then
              echo "Esito: fallito (cleanup fixture non riuscito; intervento richiesto)."
            else
              echo "Esito: fallito (HTTP ${http_code})."
            fi
            exit 1
          fi

          summary="$(jq -er '
            if .ok == true and (.data.checked | type) == "number"
              and (.data.fetched | type) == "number"
              and (.data.missing | type) == "number"
              and (.data.failed | type) == "number"
              and (.data.skipped | type) == "number"
              and .data.cleanup == "completed"
            then [.data.checked, .data.fetched, .data.missing, .data.failed, .data.skipped, .data.cleanup] | @tsv
            else empty end
          ' "$response_file" 2>/dev/null)" || {
            echo "Esito: fallito (risposta DEV non valida; nessun payload esposto)."
            exit 1
          }
          IFS=$'\t' read -r checked fetched missing failed skipped cleanup <<< "$summary"

          if [[ "$checked" == "1" && "$fetched" == "1" && "$failed" == "0" && "$cleanup" == "completed" ]]; then
            echo "Esito: superato (checked=${checked}, fetched=${fetched}, missing=${missing}, failed=${failed}, skipped=${skipped}, cleanup=${cleanup})."
            {
              echo "## E2E trascrizioni DEV"
              echo "- Esito: superato"
              echo "- Conteggi: checked=${checked}, fetched=${fetched}, missing=${missing}, failed=${failed}, skipped=${skipped}"
              echo "- Cleanup: ${cleanup}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Esito: fallito (checked=${checked}, fetched=${fetched}, missing=${missing}, failed=${failed}, skipped=${skipped}, cleanup=${cleanup})."
            {
              echo "## E2E trascrizioni DEV"
              echo "- Esito: fallito"
              echo "- Conteggi: checked=${checked}, fetched=${fetched}, missing=${missing}, failed=${failed}, skipped=${skipped}"
              echo "- Cleanup: ${cleanup}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
