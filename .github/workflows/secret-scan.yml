# =============================================================================
# Pre-merge gate: scansione segreti dedicata
# -----------------------------------------------------------------------------
# Workflow leggero e veloce che gira PRIMA di ogni merge per bloccare
# l'introduzione di chiavi/token/password nel codice.
#
# Gitleaks scansiona TUTTO il repository (root inclusa, progetto alla root).
# Non e' necessario working-directory: lo strumento legge la history Git
# direttamente da .git/ alla root.
#
# Failure BLOCCA il merge se configurato come "Required check" nelle
# Branch Protection Rules.
# =============================================================================

name: Secret Scan (Pre-Merge Gate)

on:
  push:
    branches-ignore:
      - 'dependabot/**'  # i bump Dependabot non richiedono questa scansione
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # per commentare il PR con il risultato

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con history completa
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 obbligatorio per scansionare TUTTA la history
          fetch-depth: 0

      - name: Esegui Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_COMMENTS: true   # commenta inline sui PR
          # GITLEAKS_ENABLE_SUMMARY: true    # summary nella tab Actions

      - name: Risultato
        if: failure()
        run: |
          echo "::error::Gitleaks ha trovato potenziali segreti."
          echo "::error::Esamina il log sopra, rimuovi i segreti e riscrivi la history se necessario."
          echo "::error::Se si tratta di un falso positivo, aggiungi una regola in .gitleaks.toml"
          exit 1
